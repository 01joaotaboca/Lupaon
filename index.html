<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talhão em AR</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
video,canvas{position:fixed;inset:0;width:100%;height:100%}
video{object-fit:cover}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 18px;background:linear-gradient(#000b,#0000);font-size:13px;line-height:1.4}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:24px 12px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(#0000,#000c)}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 10px;background:#E0A526;color:#1b1b1b;flex:1}
button.g{background:#ffffff2b;color:#fff}
button.r{background:#B4432F;color:#fff;flex:none;padding:10px 12px}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:#151c14;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
h2{margin:0 0 4px;font-size:20px}
p{color:#a9b8a5;font-size:14px;margin:4px 0 12px}
.it{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.it .n{flex:1;text-align:left;background:#ffffff14;color:#fff;font-weight:600}
.it .n.s{outline:2px solid #5CFF7A}
label{display:block;font-size:13px;color:#a9b8a5;margin-top:10px}
input[type=range]{width:100%}
.row{display:flex;gap:8px;margin-top:10px}
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="hud">Toque em Iniciar</div>
<div id="bar" hidden>
  <button class="g" id="bm">Menu</button>
  <button id="bp">+ Ponto aqui</button>
  <button class="g" id="bs">Salvar</button>
</div>
<div id="panel">
  <h2>Talhão em AR</h2>
  <p>Aponte a câmera para o campo e veja o contorno do talhão desenhado sobre ele. Versão de teste.</p>
  <button id="ini" style="width:100%">Iniciar câmera</button>
  <div id="lista" style="margin-top:14px"></div>
  <div class="row"><button class="g" id="teste">Quadrado de teste à frente</button></div>
  <div class="row"><button class="g" id="kmlb">Importar KML ou KMZ</button></div>
  <input type="file" id="kml" accept=".kml,.kmz,.xml,text/xml,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz" hidden>
  <p style="margin-top:12px">Para marcar andando: vá até cada canto, feche o menu e toque em "+ Ponto aqui". Depois toque em Salvar.</p>
  <label>Zoom da câmera (ajuste se o contorno parecer grande ou pequeno): <b id="fv">65</b>°</label>
  <input type="range" id="fov" min="40" max="90" value="65">
  <label>Ajuste da bússola: <b id="of">0</b>°</label>
  <input type="range" id="off" min="-45" max="45" value="0">
  <div class="row"><button class="g" id="fecha">Fechar menu</button></div>
</div>
<script>
var K="ar-talhao-v1",D={t:[],sel:null};
try{D=JSON.parse(localStorage.getItem(K))||D}catch(e){}
function sv(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
var R=Math.PI/180,pos=null,hd=0,pitch=0,hasHd=false,fov=65,off=0,draft=[],started=false;
var cv=$("c"),cx=cv.getContext("2d");
function rs(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",rs);rs();

// geometria
function enu(la,lo){return[(lo-pos.longitude)*111320*Math.cos(pos.latitude*R),(la-pos.latitude)*110574]}
function back(x,y){return[pos.latitude+y/110574,pos.longitude+x/(111320*Math.cos(pos.latitude*R))]}
function proj(x,y,h){
var d=Math.max(1,Math.hypot(x,y));
var az=((Math.atan2(x,y)/R-(hd+off)+540)%360)-180;
if(Math.abs(az)>80)return null;
var el=Math.atan((h-1.5)/d)/R,f=innerHeight/2/Math.tan(fov/2*R);
return[innerWidth/2+f*Math.tan(az*R),innerHeight/2-f*Math.tan((el-pitch)*R)]}
function inside(P){var c=false;for(var i=0,j=P.length-1;i<P.length;j=i++){
if((P[i][1]>0)!=(P[j][1]>0)&&0<(P[j][0]-P[i][0])*(0-P[i][1])/(P[j][1]-P[i][1])+P[i][0])c=!c}return c}
function dEdge(P){var m=1e9;for(var i=0;i<P.length;i++){var a=P[i],b=P[(i+1)%P.length],dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1,
t=Math.max(0,Math.min(1,-(a[0]*dx+a[1]*dy)/L));m=Math.min(m,Math.hypot(a[0]+t*dx,a[1]+t*dy))}return m}
function areaHa(pts){var la=pts[0][0],lo=pts[0][1],c=Math.cos(la*R),s=0,P=pts.map(function(p){return[(p[1]-lo)*111320*c,(p[0]-la)*110574]});
for(var i=0;i<P.length;i++){var j=(i+1)%P.length;s+=P[i][0]*P[j][1]-P[j][0]*P[i][1]}return Math.abs(s)/2/10000}

// sensores
function ori(e){
var b=(e.beta||0)*R,g=(e.gamma||0)*R;
pitch=Math.asin(Math.max(-1,Math.min(1,-Math.cos(b)*Math.cos(g))))/R;
if(e.webkitCompassHeading!=null){hd=e.webkitCompassHeading;hasHd=true}
else if(e.absolute||e.type==="deviceorientationabsolute"){
var a=(e.alpha||0)*R,cY=Math.cos(g),cZ=Math.cos(a),sX=Math.sin(b),sY=Math.sin(g),sZ=Math.sin(a);
var Vx=-cZ*sY-sZ*sX*cY,Vy=-sZ*sY+cZ*sX*cY;hd=(Math.atan2(Vx,Vy)/R+360)%360;hasHd=true}}

async function start(){
try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){
if(await DeviceOrientationEvent.requestPermission()!=="granted")throw 0}}
catch(e){alert("Permita o acesso aos sensores de movimento.");return}
var st;
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false})}
catch(e1){try{st=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}catch(e){
alert(e&&e.name==="NotAllowedError"?"A câmera está bloqueada para este site. Toque no cadeado ao lado do endereço, depois em Permissões, e permita a Câmera. Depois feche e abra o app de novo.":"Não consegui abrir a câmera ("+(e&&e.name)+"). Feche outros apps que usam a câmera e tente de novo.");return}}
$("v").srcObject=st;
addEventListener("deviceorientationabsolute",ori,true);addEventListener("deviceorientation",ori,true);
navigator.geolocation.watchPosition(function(p){pos=p.coords},function(){$("hud").textContent="Ative o GPS e permita a localização."},{enableHighAccuracy:true,maximumAge:1000});
started=true;$("ini").hidden=true;$("panel").hidden=true;$("bar").hidden=false;loop()}
$("ini").onclick=start;

// desenho
function poly(pts,col,close){
var P=pts.map(function(p){return enu(p[0],p[1])}),n=P.length,m=close?n:n-1;
cx.strokeStyle=col;cx.lineWidth=4;cx.lineJoin="round";
for(var i=0;i<m;i++){var a=P[i],b=P[(i+1)%n],L=Math.hypot(b[0]-a[0],b[1]-a[1]),k=Math.max(1,Math.ceil(L/2)),on=false;
cx.beginPath();
for(var j=0;j<=k;j++){var t=j/k,q=proj(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,0);
if(q){if(on)cx.lineTo(q[0],q[1]);else cx.moveTo(q[0],q[1]);on=true}else on=false}
cx.stroke()}
P.forEach(function(p){var g=proj(p[0],p[1],0),t=proj(p[0],p[1],4);
if(g&&t){cx.beginPath();cx.moveTo(g[0],g[1]);cx.lineTo(t[0],t[1]);cx.stroke();cx.fillStyle=col;cx.beginPath();cx.arc(t[0],t[1],6,0,7);cx.fill()}})}
function loop(){
requestAnimationFrame(loop);
var r=devicePixelRatio;cx.setTransform(r,0,0,r,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
if(!pos){$("hud").textContent="Aguardando GPS…";return}
var info=["GPS ±"+Math.round(pos.accuracy)+" m",hasHd?"Rumo "+Math.round((hd+off+360)%360)+"°":"Sem bússola neste aparelho"];
var t=D.t[D.sel];
if(t){poly(t.p,"#5CFF7A",true);
var P=t.p.map(function(p){return enu(p[0],p[1])}),ha=areaHa(t.p).toFixed(2).replace(".",",");
info.push(inside(P)?"<b>Dentro de "+t.n+"</b> · "+ha+" ha":"A "+Math.round(dEdge(P))+" m de <b>"+t.n+"</b> · "+ha+" ha")}
if(draft.length){poly(draft,"#E0A526",false);info.push(draft.length+" ponto(s) marcados")}
$("hud").innerHTML=info.join(" · ")}

// talhões
function lista(){
var h="";
D.t.forEach(function(t,i){h+='<div class="it"><button class="n'+(i===D.sel?' s':'')+'" data-s="'+i+'">'+t.n.replace(/</g,"&lt;")+' · '+areaHa(t.p).toFixed(1)+' ha</button><button class="r" data-d="'+i+'">X</button></div>'});
$("lista").innerHTML=h||'<p>Nenhum talhão ainda. Importe um KML, marque andando ou crie o quadrado de teste.</p>';
document.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){D.sel=+b.dataset.s;sv();lista()}});
document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){
if(!confirm("Apagar este talhão?"))return;D.t.splice(+b.dataset.d,1);D.sel=D.t.length?0:null;sv();lista()}})}
lista();
function need(){if(!pos||!started){alert("Toque em Iniciar câmera e espere o GPS.");return false}return true}
$("teste").onclick=function(){
if(!need())return;
var cxm=50*Math.sin(hd*R),cym=50*Math.cos(hd*R),p=[[-30,-30],[30,-30],[30,30],[-30,30]].map(function(c){return back(cxm+c[0],cym+c[1])});
D.t.push({n:"Teste 60x60 m",p:p});D.sel=D.t.length-1;sv();lista();$("panel").hidden=true};
$("kmlb").onclick=function(){$("kml").click()};
async function kmzToText(buf){
var u=new Uint8Array(buf),dv=new DataView(buf),e=-1;
for(var i=u.length-22;i>=0;i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
if(e<0)throw 0;
var n=dv.getUint16(e+10,true),p=dv.getUint32(e+16,true),best=null;
for(var k=0;k<n;k++){
var m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true),
nm=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
if(/\.kml$/i.test(nm)&&(!best||/doc\.kml$/i.test(nm)))best={m:m,cs:cs,lo:lo};
p+=46+nl+xl+cl}
if(!best)throw 0;
var q=best.lo,st=q+30+dv.getUint16(q+26,true)+dv.getUint16(q+28,true),d=u.subarray(st,st+best.cs);
if(best.m===0)return new TextDecoder().decode(d);
return await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()}
function imp(txt){
var d=new DOMParser().parseFromString(txt,"text/xml"),pm=d.getElementsByTagName("Placemark"),n=0;
for(var i=0;i<pm.length;i++){
var c=pm[i].getElementsByTagName("coordinates")[0];if(!c||!pm[i].getElementsByTagName("Polygon")[0])continue;
var nm=pm[i].getElementsByTagName("name")[0];
var p=c.textContent.trim().split(/\s+/).map(function(s){var a=s.split(",");return[+a[1],+a[0]]}).filter(function(a){return !isNaN(a[0])&&!isNaN(a[1])});
if(p.length>3&&p[0][0]==p[p.length-1][0]&&p[0][1]==p[p.length-1][1])p.pop();
if(p.length>=3){D.t.push({n:nm?nm.textContent.trim():"Talhão "+(D.t.length+1),p:p});n++}}
if(n){D.sel=D.t.length-1;sv();lista();alert(n+" talhão(ões) importado(s).")}else alert("Não achei nenhum talhão (polígono) nesse arquivo.")}
$("kml").onchange=async function(e){
var f=e.target.files[0];e.target.value="";if(!f)return;
try{imp(/\.kmz$/i.test(f.name)?await kmzToText(await f.arrayBuffer()):await f.text())}
catch(x){alert("Não consegui ler esse arquivo.")}};
$("bp").onclick=function(){if(!need())return;draft.push([+pos.latitude.toFixed(6),+pos.longitude.toFixed(6)]);if(navigator.vibrate)navigator.vibrate(50)};
$("bs").onclick=function(){
if(draft.length<3){alert("Marque pelo menos 3 pontos com \"+ Ponto aqui\".");return}
var n=prompt("Nome do talhão:","Talhão "+(D.t.length+1));if(n===null)return;
D.t.push({n:n||"Talhão",p:draft});D.sel=D.t.length-1;draft=[];sv();lista()};
$("bm").onclick=function(){$("panel").hidden=false};
$("fecha").onclick=function(){if(started)$("panel").hidden=true};
$("fov").oninput=function(){fov=+this.value;$("fv").textContent=fov};
$("off").oninput=function(){off=+this.value;$("of").textContent=off};
</script>
</body>
</html>
